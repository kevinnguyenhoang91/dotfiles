onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[update]
version_check = true

[ui]
prompt_new_tab_name = false
mouse_capture = false
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = "command", command = "/home/khanh/dotfiles/herdr/plugins/github/herdr-projects-b1278ffb803c/target/release/herdr-projects --root /home/khanh/.herdr-projects needs-you --line", interval_seconds = 15, timeout_seconds = 5 },
  { type = 'command', command = 'cat "/home/khanh/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"

[session]
resume_agents_on_restore = true
# auto_save_interval = "30s"
# save_scrollback = true

[keys]
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"
open_worktree = "prefix+shift+o"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "zsh -c -i 'lazygit'"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "export DISABLE_OMZ_PLUGINS=1; exec \"${SHELL:-sh}\""
width = "70%"
height = "50%"

[[keys.command]]
key = "prefix+alt+n"
type = "popup"
command = "export DISABLE_OMZ_PLUGINS=1; zsh -c -i 'nv'"
width = "90%"
height = "90%"

[[keys.command]]
key = "ctrl+shift+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

# herdr-nvim block
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
# <<< herdr-nvim block

[worktrees]
directory = "~/.worktrees"

# [performance]
# pane_render_optimization = true
# enable_gpu_acceleration = true
# cache_size = "2GB"

# [startup]
# restore_workspace = true
# lazy_load_plugins = true
# preload_recent_agents = 3

# [ui.animations]
# enabled = true
# duration_ms = 200

# [debug]
# log_level = "warn"
# log_file = "~/.herdr/logs/herdr.log"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip" # order: active <-> recent

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings" # settings popup

[[keys.command]]
key = "ctrl+shift+r"
type = "plugin_action"
command = "usagebar.refresh"
description = "Refresh agent usage sidebar"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "Toggle nvim sidebar"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "herdr-projects.open-popup"
description = "Projects"

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block
